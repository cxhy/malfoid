[project]
name = "malfoid"
version = "0.1.0"
description = "A local-first translation pipeline for long-form fiction (AO3 / FicHub / PDF sources), with glossary-first translation, polish and independent proofreading."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "malfoid contributors" }]
keywords = ["translation", "fanfiction", "markdown", "glossary", "proofreading"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "json-repair>=0.30",
    "requests>=2.31",
]

[project.optional-dependencies]
scrape = [
    "cloudscraper>=1.2",
    "curl-cffi>=0.17",
    "fanficfare>=4.62",
    "gdown>=6.5",
    "html2text>=2025.4",
]

[dependency-groups]
dev = [
    "pre-commit>=3.7",
    "pypandoc-binary>=1.13",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false
python-preference = "managed"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".pi", ".venv", "works"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = "-q --strict-markers"
markers = [
    "network: requires network access or a running model endpoint",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []
